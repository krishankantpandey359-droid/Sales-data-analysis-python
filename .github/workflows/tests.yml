name: Python tests and UCI Online Retail analysis

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q
      - name: Download UCI dataset and run extended sales analysis
        run: python scripts/run_online_retail_analysis.py --output-dir outputs/online_retail
      - name: Upload reproducible UCI analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: uci-online-retail-analysis
          path: outputs/online_retail/
          if-no-files-found: error
          retention-days: 14
